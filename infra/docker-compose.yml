version: "3.8"

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: carbon
      POSTGRES_USER: carbon
      POSTGRES_PASSWORD: carbonpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"  # management UI

  minio:
    image: minio/minio
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
    volumes:
      - miniodata:/data

  # optional consumer service that runs your backend/consumer.py
  consumer:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ../backend:/app:delegated
      - ../secrets/carbon-tracker-key.json:/secrets/carbon-tracker-key.json:ro
    command: ["bash", "-c", "pip install -r /app/requirements.txt && python /app/consumer.py"]
    depends_on:
      - rabbitmq
      - postgres
    environment:
      RABBIT_HOST: rabbitmq
      RABBIT_PORT: "5672"
      RABBIT_USER: guest
      RABBIT_PASS: guest
      RABBIT_QUEUE: activities
      DATABASE_URL: postgresql+psycopg2://carbon:carbonpassword@postgres:5432/carbon
      GEMINI_API_KEY: ${GEMINI_API_KEY}

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
    depends_on:
      - postgres
    volumes:
      - grafana-data:/var/lib/grafana



volumes:
  pgdata:
  miniodata:
  grafana-data:
  rabbitmq-data:
  